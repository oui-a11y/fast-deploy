name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build macOS app and publish release
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode with Swift 6
        run: |
          if [ -d "/Applications/Xcode_26.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Build app bundle
        run: scripts/build-app.sh

      - name: Package app zip
        run: |
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          ditto -c -k --keepParent ".build/DeployBar.app" "dist/DeployBar-${version}.app.zip"
          shasum -a 256 "dist/DeployBar-${version}.app.zip" > "dist/DeployBar-${version}.app.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$GITHUB_REF_NAME"
          release_notes="$(cat <<EOF
          DeployBar ${version}

          Commit: $GITHUB_SHA
          Tag: ${version}
          EOF
          )"

          if gh release view "${version}" >/dev/null 2>&1; then
            gh release edit "${version}" \
              --title "DeployBar ${version}" \
              --notes "$release_notes" \
              --latest
          else
            gh release create "${version}" \
              --title "DeployBar ${version}" \
              --notes "$release_notes" \
              --latest
          fi

          gh release upload "${version}" \
            "dist/DeployBar-${version}.app.zip" \
            "dist/DeployBar-${version}.app.zip.sha256" \
            --clobber
